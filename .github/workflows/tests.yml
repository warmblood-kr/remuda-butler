name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    # Butler's daemon-level Rust tests, built against a pinned Remuda core
    # (tests/rust_tests.sh). warmblood-kr/remuda-butler#20.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: core-ref
        run: |
          source tests/core_ref.sh
          echo "ref=$CORE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/remuda-core/target
          key: ${{ runner.os }}-cargo-${{ github.workflow }}-${{ github.ref }}-${{ steps.core-ref.outputs.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.workflow }}-${{ github.ref }}-${{ steps.core-ref.outputs.ref }}-
      - run: scripts/check-no-python.sh
      - run: sh scripts/test-no-shell-lua.sh
        env:
          CORE_REF: ${{ steps.core-ref.outputs.ref }}
      - run: tests/rust_tests.sh
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CORE_REF: ${{ steps.core-ref.outputs.ref }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/remuda-core/target

  golden:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Guidance text (help, member AGENTS.md, welcome mail, member prompt) must stay
    # byte-identical unless a PR updates tests/golden/ on purpose (hook-design §7).
    # Core pinned by CORE_REF in tests/golden_guidance.sh, same as tests/rust_tests.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tests/golden_guidance.sh

  shell:
    # Every tests/*.sh and the luajit tests (tests/shell_tests.sh), on the same
    # pinned core. None ran in CI before, so failures went unnoticed (#32).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install --yes luajit
      - run: tests/shell_tests.sh
        env:
          BUTLER_SHELL_MODE: ${{ github.event_name == 'pull_request' && 'policy' || 'all' }}

  path-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # This job runs only the pure path tables; it does not boot the Butler harness.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: choco install lua --yes --no-progress
      - name: Run pure path tables
        # The installer does not put lua on this step's PATH; call the known install path.
        run: '& "C:\Program Files (x86)\Lua\5.1\lua.exe" tests/lua/butler_path_test.lua'

  contract:
    name: butler-contract
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: core-ref
        run: |
          source tests/core_ref.sh
          echo "ref=$CORE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: warmblood-kr/remuda
          ref: ${{ steps.core-ref.outputs.ref }}
          path: remuda-core
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/remuda-core/target
          key: ${{ runner.os }}-cargo-${{ github.workflow }}-${{ github.ref }}-${{ steps.core-ref.outputs.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.workflow }}-${{ github.ref }}-${{ steps.core-ref.outputs.ref }}-
      - name: Build pinned core
        working-directory: remuda-core
        run: cargo build --manifest-path Cargo.toml -p remuda-native --bin remuda
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/remuda-core/target
      - name: Run Butler contract gate
        env:
          BUTLER_REPO: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/remuda-core/target
        run: |
          run_gate() {
            local log=$1 status
            set +e
            remuda-core/scripts/check-butler-contract.sh 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            return "$status"
          }
          log="$RUNNER_TEMP/butler-contract.log"
          if run_gate "$log"; then
            exit 0
          fi
          if ! awk '/Broken pipe/ { broken = 1; next } broken && /FAIL/ { found = 1 } END { exit !found }' "$log"; then
            exit 1
          fi
          echo "Retrying the contract gate once after the Broken pipe harness race."
          run_gate "$RUNNER_TEMP/butler-contract-retry.log"

  native-sql-661:
    name: native-sql-661
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Native SQLite behavior only exists in core 661; the default ae9 pin cannot
    # prove it. Independent of rust: it builds exactly one binary and creates
    # its own private homes/runtime. Unavailable SQL/migrations fail, never SKIP.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Registration and fail-closed guards
        run: |
          bash tests/ci/native_sql_lane_guard_test.sh
          bash tests/ci/native_sql_tests_selftest.sh
      - uses: actions/checkout@v4
        with:
          repository: warmblood-kr/remuda
          ref: 66138e39db21c8f7d069589c779bf6ac589f777c
          path: remuda-core
      - name: Toolchain identity
        id: toolchain
        run: echo "version=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/remuda-core/target
          key: native-sql-661-${{ runner.os }}-${{ runner.arch }}-66138e39db21c8f7d069589c779bf6ac589f777c-${{ steps.toolchain.outputs.version }}-${{ hashFiles('remuda-core/Cargo.lock') }}-debug
      - name: Build native 661 remuda
        # Restored Cargo output is never trusted as a binary; this always runs.
        working-directory: remuda-core
        run: cargo build --manifest-path Cargo.toml -p remuda-native --bin remuda
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/remuda-core/target
      - name: Run three real native SQL 661 suites
        env:
          REMUDA_BIN: ${{ github.workspace }}/remuda-core/target/debug/remuda
        run: tests/ci/native_sql_tests.sh
      - name: Real-binary fail-closed negatives
        env:
          REMUDA_BIN: ${{ github.workspace }}/remuda-core/target/debug/remuda
        run: tests/ci/native_sql_negative_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sql-661-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-sql-661-logs
          if-no-files-found: ignore
          retention-days: 7
