name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    # Butler's daemon-level Rust tests, built against a pinned Remuda core
    # (tests/rust_tests.sh). warmblood-kr/remuda-butler#20.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: core-ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          source tests/core_ref.sh
          echo "ref=$CORE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/remuda-core/target
          key: ${{ runner.os }}-cargo-${{ github.workflow }}-${{ github.ref }}-${{ steps.core-ref.outputs.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.workflow }}-${{ github.ref }}-${{ steps.core-ref.outputs.ref }}-
      - run: scripts/check-no-python.sh
      - run: sh scripts/test-no-shell-lua.sh
      - run: tests/rust_tests.sh
        if: github.event_name == 'workflow_dispatch'
        env:
          CORE_REF: ${{ steps.core-ref.outputs.ref }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/remuda-core/target

  golden:
    if: github.event_name == 'workflow_dispatch'
    # Guidance text (help, member AGENTS.md, welcome mail, member prompt) must stay
    # byte-identical unless a PR updates tests/golden/ on purpose (hook-design §7).
    # Core pinned by CORE_REF in tests/golden_guidance.sh, same as tests/rust_tests.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tests/golden_guidance.sh

  shell:
    # Fast logic and core contracts. The full private-daemon suite runs on demand.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes luajit
      - run: tests/fast_tests.sh

  shell-deep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install --yes luajit
      - run: tests/shell_tests.sh
        env:
          BUTLER_SHELL_MODE: all

  path-windows:
    if: github.event_name == 'workflow_dispatch'
    # This job runs only the pure path tables; it does not boot the Butler harness.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: choco install lua --yes --no-progress
      - name: Run pure path tables
        # The installer does not put lua on this step's PATH; call the known install path.
        run: '& "C:\Program Files (x86)\Lua\5.1\lua.exe" tests/lua/butler_path_test.lua'

  contract:
    name: butler-contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - id: core-ref
        run: |
          source tests/core_ref.sh
          echo "ref=$CORE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: warmblood-kr/remuda
          ref: ${{ steps.core-ref.outputs.ref }}
          path: remuda-core
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/remuda-core/target
          key: ${{ runner.os }}-butler-core-${{ steps.core-ref.outputs.ref }}
      - name: Build pinned core
        working-directory: remuda-core
        run: cargo build -p remuda-native --bin remuda
      - name: Run core and mail contract
        env:
          REMUDA_BIN: ${{ github.workspace }}/remuda-core/target/debug/remuda
        run: |
          source tests/core_ref.sh
          core_ref_check
          bash tests/lua_tests.sh tests/lua/butler_fast_contract_test.lua
          bash tests/lib/fast_caller_identity.sh

  contract-deep:
    name: butler-contract-deep
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: core-ref
        run: |
          source tests/core_ref.sh
          echo "ref=$CORE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: warmblood-kr/remuda
          ref: ${{ steps.core-ref.outputs.ref }}
          path: remuda-core
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/remuda-core/target
          key: ${{ runner.os }}-cargo-${{ github.workflow }}-${{ github.ref }}-${{ steps.core-ref.outputs.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.workflow }}-${{ github.ref }}-${{ steps.core-ref.outputs.ref }}-
      - name: Build pinned core
        working-directory: remuda-core
        run: cargo build --manifest-path Cargo.toml -p remuda-native --bin remuda
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/remuda-core/target
      - name: Run Butler contract gate
        env:
          BUTLER_REPO: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/remuda-core/target
        run: |
          run_gate() {
            local log=$1 status
            set +e
            remuda-core/scripts/check-butler-contract.sh 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            return "$status"
          }
          log="$RUNNER_TEMP/butler-contract.log"
          if run_gate "$log"; then
            exit 0
          fi
          if ! awk '/Broken pipe/ { broken = 1; next } broken && /FAIL/ { found = 1 } END { exit !found }' "$log"; then
            exit 1
          fi
          echo "Retrying the contract gate once after the Broken pipe harness race."
          run_gate "$RUNNER_TEMP/butler-contract-retry.log"
